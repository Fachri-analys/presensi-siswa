services:
  migrate:
    image: presensi-migrate:${RELEASE_TAG:-local}
    build:
      context: ./backend
      target: builder
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: file:/app/data/presensi.db
    user: "1001:1001"
    volumes:
      - sqlite_data:/app/data
    command: ["npm", "run", "prisma:migrate:deploy"]
    networks: [presensi]

  api:
    image: presensi-api:${RELEASE_TAG:-local}
    build:
      context: ./backend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: file:/app/data/presensi.db
      CORS_ORIGINS: https://${DOMAIN}
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [presensi]

  web:
    image: presensi-web:${RELEASE_TAG:-local}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?Set PUBLIC_API_BASE_URL in .env.production}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    networks: [presensi]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    profiles: [edge]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [presensi]

  seed:
    image: presensi-migrate:${RELEASE_TAG:-local}
    build:
      context: ./backend
      target: builder
    profiles: [setup]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: file:/app/data/presensi.db
    command: ["npm", "run", "prisma:seed"]
    user: "1001:1001"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [presensi]

volumes:
  sqlite_data:
    name: ${VOLUME_PREFIX:-presensi}_sqlite_data
  uploads_data:
    name: ${VOLUME_PREFIX:-presensi}_uploads_data
  caddy_data:
    name: ${VOLUME_PREFIX:-presensi}_caddy_data
  caddy_config:
    name: ${VOLUME_PREFIX:-presensi}_caddy_config

networks:
  presensi:
    driver: bridge
