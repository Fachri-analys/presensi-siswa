name: CI

on:
  push:
    branches: [main, production-ready, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          bash -n scripts/deploy-production.sh scripts/backup-production.sh scripts/ensure-runtime-db-user.sh
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          rm .env.production

      - name: Build frontend container
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid/api/v1/ -t presensi-frontend:ci .

  backend:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: file:./presensi_test.db
      PORT: 4000
      TEST_ADMIN_PASSWORD: test-admin-${{ github.run_id }}-Password
      TEST_GURU_PASSWORD: test-guru-${{ github.run_id }}-Password
      TEST_KETUA_PASSWORD: test-ketua-${{ github.run_id }}-Password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Security audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Check backend operational scripts
        run: node --check scripts/load-test.mjs && node --check scripts/audit-upload-files.mjs
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed isolated E2E fixtures
        run: npm run prisma:seed:e2e
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Run backend unit tests
        run: npm test
        working-directory: backend

      - name: Run backend e2e tests
        run: npm run test:e2e
        working-directory: backend

      - name: Build NestJS application
        run: npm run build
        working-directory: backend

      - name: Build backend container
        run: docker build -t presensi-backend:ci .
        working-directory: backend
