name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

      - name: Security audit dependencies
        run: npm audit --omit=dev

  backend:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: presensi
          POSTGRES_PASSWORD: presensi_dev_password
          POSTGRES_DB: presensi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://presensi:presensi_dev_password@localhost:5432/presensi_dev?schema=public
      SESSION_SECRET: e6b2c7e997f75e2fa41893dca6094392138ad3fe68a834279dfc82c65a88c7d1
      CSRF_SECRET: a5f1d8c946e82f3ba70932dcb6095481239bd4ef79b945380efd93d76b99d8e2
      PORT: 4000
      TEST_ADMIN_PASSWORD: Admin#2026Password!
      TEST_GURU_PASSWORD: Guru#2026Password!
      TEST_KETUA_PASSWORD: Ketua#2026Password!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed database
        run: npm run prisma:seed
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Run backend unit tests
        run: npm test
        working-directory: backend

      - name: Run backend e2e tests
        run: npm run test:e2e
        working-directory: backend

      - name: Build NestJS application
        run: npm run build
        working-directory: backend
