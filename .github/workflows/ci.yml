name: CI

on:
  push:
    branches: [main, production-ready, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          bash -n scripts/deploy-production.sh scripts/backup-production.sh scripts/ensure-runtime-db-user.sh
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          rm .env.production

      - name: Build frontend container
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid/api/v1/ -t presensi-frontend:ci .

  backend:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: file:./presensi_test.db
      PORT: 4000
      TEST_ADMIN_PASSWORD: test-admin-${{ github.run_id }}-Password
      TEST_GURU_PASSWORD: test-guru-${{ github.run_id }}-Password
      TEST_KETUA_PASSWORD: test-ketua-${{ github.run_id }}-Password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Security audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Check backend operational scripts
        run: node --check scripts/load-test.mjs && node --check scripts/audit-upload-files.mjs && node --check scripts/verify-sqlite-restore.mjs
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed isolated E2E fixtures
        run: npm run prisma:seed:e2e
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Run backend unit tests
        run: npm test
        working-directory: backend

      - name: Run backend e2e tests
        run: npm run test:e2e
        working-directory: backend

      - name: Build NestJS application
        run: npm run build
        working-directory: backend

      - name: Build backend container
        run: docker build -t presensi-backend:ci .
        working-directory: backend

  production-runtime:
    name: Production Compose runtime and SQLite restore smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare isolated production environment
        run: |
          cp .env.production.example .env.production
          sed -i 's/^DOMAIN=.*/DOMAIN=localhost/' .env.production
          sed -i 's#^PUBLIC_API_BASE_URL=.*#PUBLIC_API_BASE_URL=https://localhost/api/v1/#' .env.production

      - name: Start production Compose stack
        run: docker compose --env-file .env.production -f docker-compose.production.yml --profile edge up -d --build

      - name: Collect Compose diagnostics on startup failure
        if: failure()
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml ps -a
          docker compose --env-file .env.production -f docker-compose.production.yml logs --no-color api migrate web caddy || true
          api_container="$(docker compose --env-file .env.production -f docker-compose.production.yml ps -aq api)"
          if [ -n "$api_container" ]; then docker inspect --format '{{json .State.Health}}' "$api_container" || true; fi

      - name: Seed disposable production test account
        run: |
          ci_password="$(openssl rand -hex 24)"
          docker compose --env-file .env.production -f docker-compose.production.yml --profile setup run --rm -e INITIAL_ADMIN_EMAIL=ci-admin@example.invalid -e INITIAL_ADMIN_PASSWORD="$ci_password" seed

      - name: Wait for API and frontend health
        run: |
          for service in api web; do
            container="$(docker compose --env-file .env.production -f docker-compose.production.yml ps -q "$service")"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              sleep 2
            done
            [ "$status" = healthy ] || { echo "$service did not become healthy"; exit 1; }
          done

      - name: Verify HTTPS edge and nonce CSP
        run: |
          curl --insecure --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 --dump-header /tmp/presensi-headers-1 https://localhost/login --output /tmp/presensi-login-1.html
          curl --insecure --fail --silent --show-error --dump-header /tmp/presensi-headers-2 https://localhost/login --output /tmp/presensi-login-2.html
          ! grep -qi "unsafe-inline" /tmp/presensi-headers-1
          nonce1="$(sed -nE "s/.*script-src[^;]*'nonce-([^']+)'.*/\1/p" /tmp/presensi-headers-1 | head -n 1)"
          nonce2="$(sed -nE "s/.*script-src[^;]*'nonce-([^']+)'.*/\1/p" /tmp/presensi-headers-2 | head -n 1)"
          [ -n "$nonce1" ] && [ -n "$nonce2" ] && [ "$nonce1" != "$nonce2" ]
          grep -q "nonce=\"$nonce1\"" /tmp/presensi-login-1.html
          ! grep -Eiq '<[^>]+[[:space:]]style=' /tmp/presensi-login-1.html

      - name: Verify SQLite backup, restore, and application read
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T api node --experimental-sqlite /app/scripts/backup-sqlite.mjs /app/data/ci-backup.sqlite
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T api node -e 'require("node:fs").copyFileSync("/app/data/ci-backup.sqlite", "/app/data/ci-restored.sqlite")'
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T api node --experimental-sqlite /app/scripts/verify-sqlite-restore.mjs /app/data/presensi.db /app/data/ci-restored.sqlite
          docker compose --env-file .env.production -f docker-compose.production.yml run --rm --no-deps -e DATABASE_URL=file:/app/data/ci-restored.sqlite api node -e 'const { PrismaClient } = require("@prisma/client"); const prisma = new PrismaClient(); prisma.user.count().then((count) => { if (count !== 1) process.exitCode = 1; console.log(`Restored users: ${count}`); }).finally(() => prisma.$disconnect())'

      - name: Stop disposable stack
        if: always()
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml --profile edge down --volumes --remove-orphans || true
          rm -f .env.production /tmp/presensi-headers-* /tmp/presensi-login-*.html
