services:
  postgres:
    image: postgres:16-alpine
    container_name: presensi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-presensi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presensi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-presensi_dev}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presensi-network

  # Opsional: pgAdmin untuk lihat database via browser
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: presensi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@presensi.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-presensi_local_only_change_me}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - presensi-network
    profiles:
      - tools

volumes:
  postgres_data:
  pgadmin_data:

networks:
  presensi-network:
    driver: bridge
